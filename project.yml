name: RiepilogoIliad
options:
  bundleIdPrefix: it.ionut
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  RiepilogoIliad:
    type: application
    platform: macOS
    sources: [RiepilogoIliad]
    dependencies:
      - package: GRDB
      - package: SwiftSoup
      - package: Yams
    info:
      path: RiepilogoIliad/Info.plist
      properties:
        CFBundleDisplayName: Riepilogo Iliad
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSAppleEventsUsageDescription: "Serve per leggere i consumi tramite Safari quando la rete blocca il portale Iliad."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ionut.riepilogo-iliad
        GENERATE_INFOPLIST_FILE: NO

  RiepilogoIliadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RiepilogoIliadTests
        excludes: ["Fixtures/**"]
      - path: RiepilogoIliadTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: RiepilogoIliad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ionut.riepilogo-iliad.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RiepilogoIliad:
    build:
      targets:
        RiepilogoIliad: all
    test:
      targets:
        - RiepilogoIliadTests
